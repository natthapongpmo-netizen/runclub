<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VING Run Club · After the run</title>
<style>
:root{--y:#fde412;--ink:#111;--card:#1b1b1b;--line:#333;--mut:#b5b5b5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font-family:Helvetica,Arial,sans-serif}
.app{max-width:520px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--ink);display:flex;flex-direction:column}
header{padding:16px 20px 10px;display:flex;align-items:center;justify-content:space-between}
header img{height:20px;display:block}.step{color:var(--y);font-size:12px;font-weight:700;letter-spacing:2px}
.bar{height:4px;background:#2a2a2a;margin:0 20px}.bar span{display:block;height:4px;background:var(--y);width:0;transition:width .25s}
main{flex:1;padding:26px 20px 12px}
h1{font-size:30px;line-height:1.1;margin:0 0 10px;font-weight:800}
.sub{color:var(--mut);font-size:15px;line-height:1.5;margin:0 0 18px}
.q{font-size:24px;line-height:1.2;font-weight:800;color:var(--y);margin:0 0 6px}
.hint{color:var(--mut);font-size:13px;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:#fff;border:2px solid var(--line);border-radius:12px;padding:15px 16px;margin:0 0 10px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.opt.on{background:var(--y);color:var(--ink);border-color:var(--y)}
.opt small{display:block;font-weight:400;opacity:.8;font-size:13px;margin-top:2px}
label.f{display:block;font-size:12px;letter-spacing:1.5px;font-weight:700;color:var(--y);margin:14px 0 6px;text-transform:uppercase}
input[type=text],input[type=email],textarea{width:100%;background:var(--card);color:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;font-size:16px;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--y)}textarea{min-height:110px;resize:vertical}
.chk{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px;margin:0 0 10px;font-size:14px;line-height:1.45;cursor:pointer}
.chk i{flex:none;width:22px;height:22px;border:2px solid var(--y);border-radius:6px;display:block;margin-top:1px;text-align:center;line-height:18px;color:var(--ink);font-style:normal;font-weight:800}
.chk.on i{background:var(--y)}.chk.on{border-color:var(--y)}
.rows .r{margin:0 0 16px}.rows .t{font-size:15px;font-weight:700;margin:0 0 8px}
.scale{display:flex;gap:6px}.scale button{flex:1;background:var(--card);color:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 0;font-size:18px;cursor:pointer;font-family:inherit}
.scale button.on{background:var(--y);color:var(--ink);border-color:var(--y);font-weight:800}
.scale.n button{font-size:15px;font-weight:700;padding:12px 0}
.ends{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-top:4px}
.note{background:#181818;border-left:4px solid var(--y);padding:12px 14px;font-size:13px;line-height:1.5;color:#ddd;margin:0 0 14px}
.err{color:#ff8a80;font-size:14px;min-height:20px;margin:6px 0 0}
footer{padding:12px 20px 24px;display:flex;gap:10px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--ink) 30%)}
.btn{flex:1;border:0;border-radius:12px;padding:16px;font-size:16px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:inherit}
.next{background:var(--y);color:var(--ink)}.back{flex:0 0 auto;background:#2a2a2a;color:#fff;padding:16px 20px}.btn[disabled]{opacity:.45}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.done{text-align:center;padding-top:30px}.done .big{font-size:56px}
</style></head><body>

<div class="bar"><span id="prog"></span></div>
<main id="main"></main>
<footer id="foot"><button class="btn back" id="back" type="button">Back</button><button class="btn next" id="next" type="button">Next</button></footer>
</div>
<script>
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbzeJ5pDL9aw-sD3kxUMld5zZw-PHgkUqTE-PjPpCKxgRCzM25kxnQ1D728yxg2qv2cb/exec';
var A = {};            // answers
var hp = '';           // honeypot
var sid = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
var FACES = ['😖','😕','😐','🙂','😍'];

function worn(k){ var w=A.which_worn; return w==='both' || w===k; }
var S = [
 {id:'who', title:'Welcome', render:function(){ return '<h1>How did it go?</h1><p class="sub">Thank you for running with VING in New York. This takes about 3 minutes. First, who is answering?</p>'+
   '<label class="f" for="name">Your name</label><input type="text" id="name" autocomplete="name" maxlength="100" placeholder="First and last name" value="'+esc(A.name)+'">'+
   '<label class="f" for="email">Email (optional)</label><input type="email" id="email" autocomplete="email" maxlength="120" placeholder="you@example.com" value="'+esc(A.email)+'">'+
   '<p class="hint" style="margin-top:8px">Only if you are happy for us to follow up with you.</p><input class="hp" tabindex="-1" autocomplete="off" id="hp" aria-hidden="true">'; },
   valid:function(){ A.name=val('name').trim(); A.email=val('email').trim(); hp=val('hp'); if(!A.name) return 'Please type your name.'; if(A.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(A.email)) return 'That email does not look right.'; return ''; }},
 {id:'consent', title:'Privacy and photos', render:function(){ return '<p class="q">Two quick confirmations</p>'+
   '<div class="note"><b>Privacy notice.</b> VING uses your answers to improve its products and events. They are reviewed by the VING team, mostly as a group. Your name is stored with your answers so we can follow up and so we can match them to the event. Answers are stored in VING\'s Google account and kept only as long as needed for this review. To see or delete your answers, reply to the email you received from VING.</div>'+
   chk('privacy_ok','I have read the privacy notice and agree to my answers being used this way.')+
   '<p class="q" style="font-size:18px;margin-top:18px">Photos from the event</p>'+
   '<p class="hint">VING took photos and videos at the run. Please choose one.</p>'+
   opt('photo_choice','agree','VING may share images that include me','on VING\'s official social media channels only. No payment, no paid advertising, never sold. I can withdraw any time.')+
   opt('photo_choice','no','Please do not feature me','VING will not use close-up images of me.'); },
   valid:function(){ if(!A.privacy_ok) return 'Please tick the privacy confirmation to continue.'; if(!A.photo_choice) return 'Please choose a photo option.'; return ''; }},
 {id:'runs', render:function(){ return '<p class="q">How often do you run?</p>'+ opts('runs_per_week',[['0-1','0 to 1 times a week'],['2-3','2 to 3 times a week'],['4-5','4 to 5 times a week'],['6+','6 or more']]); }, valid:req('runs_per_week')},
 {id:'sandal', render:function(){ return '<p class="q">Have you run in sandals before?</p>'+ opts('sandal_before',[['regularly','Yes, regularly'],['some','A few times'],['first','This was my first time']]); }, valid:req('sandal_before')},
 {id:'socks', render:function(){ return '<p class="q">What did you wear on your feet?</p>'+ opts('socks',[['split-toe','Split-toe (tabi) socks'],['regular','Regular socks'],['none','No socks'],['other','Something else']]); }, valid:req('socks')},
 {id:'which', render:function(){ return '<p class="q">Which VING sandals did you wear today?</p><p class="hint">We will only ask about the ones you tried.</p>'+ opts('which_worn',[['both','Both Nirun 2.0 and Nirun Pro'],['n2','Nirun 2.0'],['pro','Nirun Pro'],['none','Neither, I ran in my own shoes']]); }, valid:req('which_worn')},
 grid('n2','Nirun 2.0',function(){return worn('n2');}),
 issues('n2','Nirun 2.0',function(){return worn('n2');}),
 grid('pro','Nirun Pro',function(){return worn('pro');}),
 issues('pro','Nirun Pro',function(){return worn('pro');}),
 {id:'prefer', when:function(){return A.which_worn==='both';}, render:function(){ return '<p class="q">Which did you prefer?</p>'+ opts('preferred',[['n2','Nirun 2.0'],['pro','Nirun Pro'],['same','No preference']]); }, valid:req('preferred')},
 {id:'buy', when:function(){return A.which_worn!=='none';}, render:function(){ return '<p class="q">Would you buy a pair?</p>'+ opts('would_buy',[['yes','Yes'],['maybe','Maybe'],['no','No']]); }, valid:req('would_buy')},
 {id:'nps', render:function(){ var h='<p class="q">How likely are you to recommend VING Run Club to a friend?</p><p class="hint">0 = not at all, 10 = definitely</p><div class="scale n" style="flex-wrap:wrap">'; for(var i=0;i<=10;i++){ h+='<button type="button" style="flex:0 0 calc(25% - 5px);margin-bottom:6px" data-k="nps" data-v="'+i+'" class="'+(A.nps===String(i)?'on':'')+'">'+i+'</button>'; } return h+'</div>'; }, valid:req('nps')},
 {id:'event', render:function(){ return '<p class="q">Rate the day</p><p class="hint">1 = poor, 5 = great</p><div class="rows">'+ row('ev_org','Check-in and organisation',false)+ row('ev_route','The route',false)+ row('ev_team','The VING team',false)+ row('ev_coffee','Coffee and activities',false)+'</div>'; }, valid:function(){ var ks=['ev_org','ev_route','ev_team','ev_coffee']; for(var i=0;i<ks.length;i++) if(!A[ks[i]]) return 'Please rate each one.'; return ''; }},
 {id:'improve', render:function(){ return '<p class="q">One thing we should improve</p><p class="hint">Optional, but it helps a lot.</p><textarea id="improve" maxlength="800" placeholder="Type here">'+esc(A.improve)+'</textarea><p class="q" style="font-size:18px;margin-top:20px">Would you join another VING run?</p>'+ opts('join_again',[['yes','Yes'],['maybe','Maybe'],['no','No']]); }, valid:function(){ A.improve=val('improve').trim(); if(!A.join_again) return 'Please choose one.'; return ''; }},
 {id:'final', render:function(){ return '<p class="q">Anything else?</p><p class="hint">Optional.</p><textarea id="final" maxlength="1200" placeholder="Anything about the sandals or the day">'+esc(A.final_comment)+'</textarea>'; }, valid:function(){ A.final_comment=val('final').trim(); return ''; }, last:true}
];
function grid(k,name,when){ return {id:k+'g', when:when, render:function(){ return '<p class="q">'+name+'</p><p class="hint">How did it feel? Tap a face.</p><div class="rows">'+ row(k+'_overall','Overall',true)+ row(k+'_fit','Fit and hold',true)+ row(k+'_cushion','Cushioning',true)+ row(k+'_toepost','Toe post comfort',true)+ row(k+'_grip','Grip',true)+'</div><div class="ends"><span>😖 Poor</span><span>Great 😍</span></div>'; }, valid:function(){ var ks=['overall','fit','cushion','toepost','grip']; for(var i=0;i<ks.length;i++) if(!A[k+'_'+ks[i]]) return 'Please rate each one.'; return ''; }}; }
function issues(k,name,when){ var L=[['none','No problems'],['toe','Toe or toe post'],['arch','Arch'],['heel','Heel'],['strap','Strap or rubbing'],['blister','Blister or hot spot'],['other','Something else']]; return {id:k+'i', when:when, render:function(){ var sel=A[k+'_issues']||[]; var h='<p class="q">'+name+': any problems?</p><p class="hint">Choose all that apply.</p>'; L.forEach(function(o){ h+='<button type="button" class="opt'+(sel.indexOf(o[0])>-1?' on':'')+'" data-multi="'+k+'_issues" data-v="'+o[0]+'">'+o[1]+'</button>'; }); return h+'<label class="f" for="'+k+'c">Comments (optional)</label><textarea id="'+k+'c" maxlength="800" placeholder="What did you like or dislike?">'+esc(A[k+'_comment'])+'</textarea>'; }, valid:function(){ A[k+'_comment']=val(k+'c').trim(); if(!(A[k+'_issues']||[]).length) return 'Please choose at least one option.'; return ''; }}; }
function row(key,label,faces){ var h='<div class="r"><div class="t">'+label+'</div><div class="scale">'; for(var i=1;i<=5;i++){ h+='<button type="button" data-k="'+key+'" data-v="'+i+'" class="'+(A[key]===String(i)?'on':'')+'" aria-label="'+i+'">'+(faces?FACES[i-1]:i)+'</button>'; } return h+'</div></div>'; }
function opt(k,v,t,s){ return '<button type="button" class="opt'+(A[k]===v?' on':'')+'" data-k="'+k+'" data-v="'+v+'">'+t+(s?'<small>'+s+'</small>':'')+'</button>'; }
function opts(k,l){ return l.map(function(o){ return opt(k,o[0],o[1]); }).join(''); }
function chk(k,t){ return '<div class="chk'+(A[k]?' on':'')+'" data-chk="'+k+'" role="checkbox" aria-checked="'+(!!A[k])+'" tabindex="0"><i>'+(A[k]?'✓':'')+'</i><span>'+t+'</span></div>'; }
function req(k){ return function(){ return A[k]?'':'Please choose one.'; }; }
function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function val(id){ var e=document.getElementById(id); return e?e.value:''; }

var order=[], pos=0, busy=false;
function visible(){ return S.filter(function(s){ return !s.when || s.when(); }); }
function show(keepScroll){
  order=visible(); var s=order[pos]; var m=document.getElementById('main');
  m.innerHTML=s.render()+'<div class="err" id="err"></div>';
  document.getElementById('step').textContent=(pos+1)+' / '+order.length;
  document.getElementById('prog').style.width=((pos)/order.length*100)+'%';
  document.getElementById('back').style.display=pos?'':'none';
  var nx=document.getElementById('next'); nx.textContent=s.last?'Send':'Next'; nx.disabled=false;
  if(!keepScroll) window.scrollTo(0,0);
}
function err(t){ document.getElementById('err').textContent=t||''; }
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-k],[data-multi],[data-chk]'); if(!t) return;
  if(t.dataset.chk){ A[t.dataset.chk]=!A[t.dataset.chk]; keep(); show(true); return; }
  if(t.dataset.multi){ var k=t.dataset.multi, v=t.dataset.v, a=A[k]||[]; if(v==='none'){ a=a.indexOf('none')>-1?[]:['none']; } else { a=a.filter(function(x){return x!=='none';}); var i=a.indexOf(v); if(i>-1)a.splice(i,1); else a.push(v); } A[k]=a; keep(); show(true); return; }
  A[t.dataset.k]=t.dataset.v; keep();
  // refresh selection in place, keep typed text; auto-advance only on single-choice screens
  var s=order[pos]; var single=/^(runs|sandal|socks|which|prefer|buy|nps)$/.test(s.id);
  if(single){ show(true); setTimeout(function(){ document.getElementById('next').click(); },180); } else { show(true); }
});
document.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.chk){ e.preventDefault(); e.target.click(); } });
function keep(){ var ids=['name','email','improve','final','n2c','proc']; ids.forEach(function(id){ var e=document.getElementById(id); if(!e) return; var map={name:'name',email:'email',improve:'improve',final:'final_comment',n2c:'n2_comment',proc:'pro_comment'}; A[map[id]]=e.value; }); }
document.getElementById('back').onclick=function(){ keep(); if(pos>0){ pos--; show(); } };
document.getElementById('next').onclick=function(){
  if(busy) return; var s=order[pos]; var m=s.valid?s.valid():''; if(m){ err(m); return; }
  if(s.last){ submit(); return; }
  pos++; if(pos>=visible().length) pos=visible().length-1; show();
};
function submit(){
  busy=true; var nx=document.getElementById('next'); nx.disabled=true; nx.textContent='Sending…'; err('');
  var p={}; Object.keys(A).forEach(function(k){ p[k]=A[k]; }); p.sid=sid; p.hp=hp; p.client_time=new Date().toISOString(); p.ua=navigator.userAgent.slice(0,160);
  fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
   .then(function(r){ return r.json(); })
   .then(function(j){ if(j&&j.ok){ done(); } else { throw new Error((j&&j.error)||'failed'); } })
   .catch(function(){ busy=false; nx.disabled=false; nx.textContent='Send'; err('Sorry, we could not send your answers. Please check your connection and tap Send again.'); });
}
function done(){
  document.getElementById('foot').style.display='none'; document.getElementById('prog').style.width='100%'; document.getElementById('step').textContent='DONE';
  document.getElementById('main').innerHTML='<div class="done"><div class="big">🙌</div><h1>Thank you, '+esc((A.name||'').split(' ')[0])+'!</h1><p class="sub">Your answers are in. See you on the next run with VING.</p></div>';
}
show();
</script></body></html>
